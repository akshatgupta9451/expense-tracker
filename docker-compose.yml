services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: .env
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: [./backend:/app]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    # Background jobs (exports, AI insights) arrive in a later phase: `docker compose --profile worker up`
    profiles: ["worker"]
    build: ./backend
    env_file: .env
    command: arq app.workers.worker.WorkerSettings
    volumes: [./backend:/app]
    depends_on: [db, redis]

  frontend:
    build: ./frontend
    env_file: .env
    command: npm run dev -- --host 0.0.0.0
    volumes: [./frontend:/app, /app/node_modules]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
